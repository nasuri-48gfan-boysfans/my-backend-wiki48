<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ajukan akses kontribusi ke WIKI48." />
  <title>Ajukan Akses - WIKI48</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ff806b" />
  <link rel="apple-touch-icon" href="img/icon-192.svg" />
</head>
<body class="access-page">
  <header class="site-header"><div class="container header-inner"><a href="index.html#hero" class="logo" aria-label="WIKI48 home"><span class="logo-badge" aria-hidden="true"><span class="logo-badge-heart">♥</span><span class="logo-word">WIKI</span><strong>48</strong><i>✦</i></span><span class="logo-text">WIKI<span class="logo-accent">48</span></span></a><a class="auth-home-link" href="index.html#hero">← Beranda</a></div></header>
  <main class="access-main"><section class="access-card" aria-labelledby="accessTitle"><div class="auth-mark" aria-hidden="true">✦</div><p class="eyebrow lilac-eyebrow">Permohonan akses</p><h1 id="accessTitle">Bantu rawat <span>WIKI48</span></h1><p class="auth-subtitle">Ceritakan kontribusi yang ingin kamu lakukan. Pemilik wiki akan meninjau setiap pengajuan secara manual.</p>
    <form id="accessRequestForm" class="access-form">
      <label for="accessName">Nama</label><input id="accessName" name="name" type="text" minlength="2" maxlength="80" autocomplete="name" required />
      <label for="accessEmail">Email untuk dihubungi</label><input id="accessEmail" name="email" type="email" maxlength="254" autocomplete="email" required />
      <label for="accessCountry">Negara atau ruang komunitas</label><select id="accessCountry" name="country" required><option value="">Pilih ruang</option><option value="ID">Indonesia</option><option value="JP">Jepang</option><option value="TH">Thailand</option><option value="CN">Tiongkok</option><option value="TW">Taiwan</option><option value="MY">Malaysia</option><option value="OTHER">Lainnya</option></select>
      <label for="accessLevel">Jenis akses yang diminta</label><select id="accessLevel" name="accessLevel" required><option value="">Pilih akses</option><option value="reader">Pembaca terverifikasi</option><option value="contributor">Kontributor data/artikel</option><option value="editor">Editor komunitas</option></select>
      <label for="accessReason">Apa yang ingin kamu bantu?</label><textarea id="accessReason" name="reason" minlength="20" maxlength="500" placeholder="Contoh: memperbarui profil member dan sumber resmi JKT48..." required></textarea>
      <label for="accessExperience">Pengalaman atau contoh kontribusi <span class="optional-label">(opsional)</span></label><textarea id="accessExperience" name="experience" maxlength="500" placeholder="Link atau ringkasan pengalaman yang relevan"></textarea>
      <label class="access-consent"><input name="agreedRules" type="checkbox" required /> Saya bersedia mengikuti aturan komunitas, mencantumkan sumber, dan tidak mengubah data secara sembarangan.</label>
      <p id="accessRequestResult" class="auth-error" role="alert"></p><button class="auth-submit" type="submit">Kirim pengajuan <span>→</span></button>
    </form>
    <p class="auth-note">Jangan kirim password, nomor identitas, atau data sensitif di formulir ini.</p>
  </section></main>
  <footer class="site-footer"><div class="container"><p>© <span id="year">2026</span> WIKI48</p></div></footer>
  <script src="api-config.js" defer></script><script src="access-request.js" defer></script><script src="pwa.js" defer></script>
</body>
</html>
